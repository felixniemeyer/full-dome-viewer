<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/full-dome-simulator.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>planetarium-simulator</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="selector" class="selector">
      <label for="file">
        Click to upload a domemaster file (image or video)
        <input type="file" id="file" accept="image/*, video/*" />
      </label>
    </div>
    <div id="loading" class="loading" hidden>
      <span class="spinner"></span>
      <span id="loading-text">Loading…</span>
    </div>
    <div id="timeline" class="timeline">
      <input type="range" id="time-slider" min="0" max="1" step="0.001" value="0" />
      <span id="time-label">0:00 | 0:00</span>
    </div>
    <div id="controls" class="controls">
      <label for="fov-slider">FOV (°):</label>
      <input type="range" id="fov-slider" min="10" max="120" step="0.1" value="90" />
      <input type="text" id="fov-text" value="90" />
      <br/>
      <label for="audio-checkbox">Audio:</label>
      <input type="checkbox" id="audio-checkbox" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
