<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/full-dome-simulator.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>planetarium-simulator</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="selector">
      <input type="file" id="file" accept="image/*" />
    </div>
    <div id="controls" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 10px; color: white;">
      <label for="dome-scale-slider">Scale:</label>
      <input type="range" id="dome-scale-slider" min="0.48" max="0.5" step="0.0001" value="0.5" style="width: 300px;" />
      <input type="text" id="dome-scale-text" value="0.5" style="width: 60px;" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
